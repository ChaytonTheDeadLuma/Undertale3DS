
name: Build LOVE for Nintendo 3DS

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out LOVE game source
        uses: actions/checkout@v4
        with:
          path: game-source

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git make zip \
            wget curl python3

      - name: Set up devkitPro
        run: |
          wget https://apt.devkitpro.org/install-devkitpro-pacman
          chmod +x install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --noconfirm \
            3ds-dev 3ds-portlibs

      - name: Prepare LOVE project
        run: |
          git clone https://github.com/videah/LovePotion.git lovepotion
          cp -a game-source/game lovepotion/
          cp -a game-source/meta lovepotion/
          cp game-source/Makefile lovepotion/Makefile

      - name: Build 3DSX
        run: |
          cd lovepotion
          make -j2

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: LOVE-3DS-build
          path: |
            lovepotion/*.3dsx
            lovepotion/*.smdh
          if-no-files-found: error
